# pair - hledger accounting system configuration (legacy example)
# This is the old consult-style config. See entities/<slug>/config.yaml for current format.

entities:
  my-company:
    name: "Your Company Name"
    business_number: "123-456-789-RT0001"
    email: "you@example.com"
    phone: "555-1234"
    payment_terms: "Net 30 days"
    currency: CAD
    tax: 13
    invoice_prefix: ""
    next_invoice: 2026-001
    journal_file: "~/.hledger.journal"
    # Template (optional): filename within templates/ directory.
    # If not set, uses templates/invoice.typ
    template: null
    accounts:
      receivable: "Assets:Accounts Receivable"
      income: "Income:Consulting"
      tax_liability: "Liabilities:HST Payable"
      bank: "Assets:Chequing"

# Project files (in projects/*.yaml) can also specify:
#   template: "custom-client.typ"
# Resolution order: project template > entity template > templates/invoice.typ

defaults:
  entity: my-company
  last_project: null

# Saved reports (I76): named hledger queries, run with
# `pair report run <name>`, listed with `pair report list`, or built
# on the spot with `pair report build ... [--save <name>]`. The web
# Reports tab runs the same definitions. See docs/commands.md.
# Keys: title (optional), command (register/print/bal/balance/bs/is/
# accounts), query (optional hledger terms), period (YYYY, YYYY-MM,
# YYYY-MM-DD or YYYYQn), monthly/tree/flat (optional true/false).
# Query terms starting with '-' are rejected, as in /api/search.
#reports:
#  monthly-expenses:
#    title: Monthly expenses
#    command: register
#    query: "acct:Expenses"
#    monthly: true

# Bank statement mappings (I69): declared CSV column maps, named here
# and referenced with `pair account import <file> --mapping <name>`.
# Keys: date, description, and either amount OR the debit/credit pair;
